name: Build PDF Reader APK

on:
  push:
    branches:
      - "claude/pdf-reader-android-app-**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners ship with the Android SDK preinstalled (ANDROID_HOME /
      # ANDROID_SDK_ROOT already point at platforms + build-tools), so no extra SDK setup
      # action is needed here.

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lector-pdf-debug-apk
          path: app/build/outputs/apk/debug/*.apk
