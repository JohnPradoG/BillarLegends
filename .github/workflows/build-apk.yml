name: Build PDF Reader APK

on:
  push:
    branches:
      - "claude/pdf-reader-android-app-**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners ship with the Android SDK preinstalled (ANDROID_HOME /
      # ANDROID_SDK_ROOT already point at platforms + build-tools), so no extra SDK setup
      # action is needed here.

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lector-pdf-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # GitHub Actions artifacts are only downloadable through the Actions blob storage
      # host; also publish the APK as a release asset (served from github.com /
      # objects.githubusercontent.com) so it can be fetched from environments that can't
      # reach the artifact storage host directly.
      - name: Publish APK as a GitHub Release asset
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-debug-build --yes --cleanup-tag || true
          gh release create latest-debug-build app/build/outputs/apk/debug/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Lector PDF - último build de depuración" \
            --notes "APK de depuración generado automáticamente desde el commit $GITHUB_SHA (rama $GITHUB_REF_NAME)." \
            --prerelease
